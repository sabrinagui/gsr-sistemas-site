name: GSR site image and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gsr-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/sabrinagui/gsr-sistemas-site:${{ github.sha }}
            ghcr.io/sabrinagui/gsr-sistemas-site:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Send immutable image SHA through dedicated SSH key
        env:
          SSH_HOST: ${{ secrets.GSR_SSH_HOST }}
          SSH_PORT: ${{ secrets.GSR_SSH_PORT }}
          SSH_USER: ${{ secrets.GSR_SSH_USER }}
          SSH_KEY: ${{ secrets.GSR_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GSR_SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ needs.image.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/gsr-deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/gsr-deploy" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "gsr-deploy $DEPLOY_SHA"
